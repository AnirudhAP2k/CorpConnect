services:
  server:
    build:
      context: .
      target: dev
    command: pnpm exec next dev
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
      # Container-to-container calls must use Compose service names.
      AI_SERVICE_URL: http://ai-service:8000
      LV_SERVICE_URL: http://lv-service:5000
      REDIS_URL: redis://redis:6379
      DATABASE_URL: ${LOCAL_DATABASE_URL}

  ai-service:
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./ai-service:/app
    environment:
      NODE_ENV: development
      REDIS_URL: redis://redis:6379
      DATABASE_URL: ${LOCAL_DATABASE_URL}

  ws-service:
    build:
      context: ./ws-service
      target: builder
    command: pnpm dev
    volumes:
      - ./ws-service:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
      NEXTJS_URL: http://server:3000
      REDIS_URL: redis://redis:6379
      DATABASE_URL: ${LOCAL_DATABASE_URL}

  lv-service:
    build:
      context: ./lv-service
      target: builder
    command: pnpm dev
    volumes:
      - ./lv-service:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
      NEXTJS_URL: http://server:3000
      DATABASE_URL: ${LOCAL_DATABASE_URL}
